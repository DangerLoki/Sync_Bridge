[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sync-bridge"
version = "0.1.0"
description = "Ferramenta modular em Python para movimentação de dados"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "click==8.3.1",
    "pandas==2.2.3",
    "numpy==2.4.3",
]

[project.optional-dependencies]
api = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "Jinja2==3.1.6",
    "python-multipart==0.0.22",
]
parquet = [
    "pyarrow==19.0.1",
]
oracle = [
    "oracledb>=3.1,<4",
]
sqlserver = [
    "pyodbc==5.2.0",
]
bigquery = [
    "google-cloud-bigquery>=3.41,<4",
    "db-dtypes>=1.5,<2",
]
dev = [
    "pytest==9.0.2",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.0"
]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # erros, warnings, imports ordenados

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

