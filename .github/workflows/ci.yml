name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        
      - name: Install dependencies
        run: pip install -e ".[dev,parquet,api]"

      - name: Rodar testes com cobertura
        run: python -m pytest -q --cov=src --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy pandas-stubs
      - run: ruff check src/
      - run: mypy src/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker (target api)
        run: docker build --target api -t sync-bridge-api:ci .

      - name: Subir container em background
        run: |
          docker run -d --name sync-bridge-test -p 8000:8000 sync-bridge-api:ci
          sleep 5  # aguarda o uvicorn inicializar

      - name: Testar endpoint /health
        run: |
          curl --fail --silent --show-error http://localhost:8000/health

      - name: Derrubar container
        if: always()
        run: docker rm -f sync-bridge-test